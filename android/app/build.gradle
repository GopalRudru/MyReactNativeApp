apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'
apply plugin: "com.google.firebase.crashlytics"

project.ext.react = [
        nodeExecutableAndArgs: [System.getenv("NODE_BINARY") ?: "/opt/homebrew/bin/node"]
]

react {
    autolinkLibrariesWithApp()
}

def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.customermobapp.avanse"

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    defaultConfig {
        applicationId "com.customermobapp.avanse"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 31
        versionName "1.0.6"
        multiDexEnabled true

        // REQUIRED for 16 KB page support → 64-bit only
        ndk {
            abiFilters.clear()
            abiFilters "arm64-v8a"
        }



        bundle {
            language.enableSplit = true
            density.enableSplit = true
            abi.enableSplit = false   // Disable ABI splits to ensure ARM64-only
        }
    }

    // REQUIRED: Prevent Gradle from generating armv7/x86 automatically
    splits {
        abi {
            enable false
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }



    // Enhanced packaging options for 16KB page size support
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false

            // Force-remove all 32-bit ABIs and non-ARM64 architectures
            excludes += [
                    "**/armeabi/**",
                    "**/armeabi-v7a/**",
                    "**/x86/**",
                    "**/x86_64/**",
                    "**/mips/**",
                    "**/mips64/**"
            ]

            // Ensure proper library paths for ARM64 only
            pickFirsts += [
                    "**/libc++_shared.so",
                    "**/libfbjni.so"
            ]
        }

        // Additional resource exclusions
        resources {
            excludes += [
                    "/META-INF/{AL2.0,LGPL2.1}",
                    "/META-INF/DEPENDENCIES",
                    "/META-INF/LICENSE",
                    "/META-INF/LICENSE.txt",
                    "/META-INF/NOTICE",
                    "/META-INF/NOTICE.txt"
            ]
        }
    }



    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(AVANSE_RELEASE_STORE_FILE)
            storePassword AVANSE_RELEASE_STORE_PASSWORD
            keyAlias AVANSE_RELEASE_KEY_ALIAS
            keyPassword AVANSE_RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            // Explicit 16KB page size support configuration
            ndk {
                abiFilters.clear()
                abiFilters "arm64-v8a"  // Only ARM64 for 16KB page support
            }



            // Ensure proper native library optimization
            packagingOptions {
                jniLibs {
                    useLegacyPackaging = false
                }
            }
        }
    }

    // Custom APK naming
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def buildType = variant.buildType.name
            def versionName = variant.versionName
            def appName = "AvanseFinancialServices"

            if (buildType == 'release') {
                outputFileName = "${appName}_${buildType}_v${versionName}.apk"
            } else if (buildType == 'debug') {
                outputFileName = "${appName}_${buildType}_v${versionName}.apk"
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    // Required for GIF support on Android (Fresco animated GIF decoder)
    implementation 'com.facebook.fresco:animated-gif:3.4.0'
    implementation 'com.google.firebase:firebase-crashlytics:19.4.3'
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation "androidx.fragment:fragment:1.8.5"
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"

    compileOnly 'com.github.shyiko.klob:klob:0.2.1'
    implementation 'com.guardsquare:proguard-annotations:7.4.0'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
